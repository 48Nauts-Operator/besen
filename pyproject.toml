[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "besen"
version = "0.1.0"
description = "macOS disk cleanup CLI — scan, clean, and move files to NAS"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0",
    "psutil>=5.9",
    "pydantic-settings>=2.0",
    "humanize>=4.0",
]

[project.scripts]
besen = "besen.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["besen"]
